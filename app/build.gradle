plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.expensetracker'
    compileSdk 34

    defaultConfig {
        applicationId "com.example.expensetracker"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    // Jakarta Mail bundles some META-INF files that can clash at packaging time.
    packaging {
        resources {
            excludes += [
                'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt',
                'META-INF/LICENSE.md', 'META-INF/NOTICE.md',
                'META-INF/LICENSE', 'META-INF/NOTICE',
                'META-INF/DEPENDENCIES'
            ]
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'

    // MPAndroidChart for pie/bar charts
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // Jakarta Mail (JavaMail) — sends the monthly report email over SMTP
    implementation 'com.sun.mail:android-mail:1.6.7'
    implementation 'com.sun.mail:android-activation:1.6.7'

    // WorkManager — runs the automatic monthly email in the background
    implementation 'androidx.work:work-runtime:2.9.1'
}
